name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  hardware-free:
    name: hardware-free unit tests (no MuJoCo, no ROS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test deps
        run: pip install numpy pytest
      - name: Wire protocol, wire + sandbox security, joint map, driver safety, NL parser, ros2_control URDF
        run: >
          pytest -q
          tools/skate_ros2/test/test_protocol_loopback.py
          tools/skate_ros2/test/test_wire_safe.py
          tools/skate_commander/test/test_sandbox.py
          tools/skate_ros2/test/test_names.py
          tools/skate_ros2/test/test_driver_logic.py
          tools/skate_commander/test/test_nl.py
          tools/skate_ros2_control/test/test_make_control_urdf.py
      - name: ACT eval numbers match committed raw data (no GPU)
        run: pytest -q tools/skate_commander/examples/act_reach/test_eval_numbers.py
      - name: Manipulation eval numbers match committed raw data (no MuJoCo)
        run: pytest -q sim/test_manipulation_numbers.py

  sim-model:
    name: model-gated tests (MuJoCo guard / planner / IK / URDF)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps (cockpit + MuJoCo, pinned)
        run: pip install -r tools/skate_commander/requirements.txt "mujoco==3.10.0" pytest
      - name: Fetch the official skt_v3 model (pinned)
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/Rbotic/skate_teleop.git
          git -C skate_teleop checkout 1622ac2d9a3a2747e441c354145c3d0b7fc0fc50
      - name: Build the control + collision + cell models
        run: |
          python sim/make_control_model.py skate_teleop/skt_v3
          python sim/make_collision_model.py skate_teleop/skt_v3
          python sim/make_cell_scene.py skate_teleop/skt_v3
      - name: Collision guard, RRT planner, IK, obstacles, URDF
        env:
          SKT_DIR: skate_teleop/skt_v3
        run: >
          pytest -q
          tools/skate_commander/test/test_guard.py
          tools/skate_commander/test/test_planner.py
          tools/skate_commander/test/test_kinematics.py
          tools/skate_commander/test/test_obstacles.py
          tools/skate_commander/test/test_urdf.py

      - name: Wrist force/torque sensor calibration (M1)
        env:
          SKT_DIR: skate_teleop/skt_v3
        run: pytest -q sim/test_ft_sensor.py

      - name: Force-regulated insertion — misalignment recovery (M2)
        env:
          SKT_DIR: skate_teleop/skt_v3
        run: pytest -q sim/test_insertion.py

      - name: Cartesian admittance — e = F/K, push-and-yield (M3)
        env:
          SKT_DIR: skate_teleop/skt_v3
        run: pytest -q sim/test_admittance.py

      - name: Bimanual compliant carry — internal-force regulation (M3+)
        env:
          SKT_DIR: skate_teleop/skt_v3
        run: pytest -q sim/test_carry.py

      - name: Grasp-force control and slip curve (M4)
        env:
          SKT_DIR: skate_teleop/skt_v3
        run: pytest -q sim/test_gripper.py

      - name: Weld-free grasp, carry and place (M4 capstone)
        env:
          SKT_DIR: skate_teleop/skt_v3
        run: pytest -q sim/test_gripper_arm.py

      - name: Cockpit contact modes — stop vs compliant (M3+)
        env:
          SKT_DIR: skate_teleop/skt_v3
        run: pytest -q tools/skate_commander/test/test_compliant.py
